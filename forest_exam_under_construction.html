<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기출문제 페이지 공사중</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 18px;
    background: #f0f4f0;
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    color: #243428;
  }
  .notice {
    width: min(100%, 440px);
    padding: 40px 30px;
    border-radius: 18px;
    background: #fff;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    text-align: center;
  }
  .icon { font-size: 3.4rem; margin-bottom: 16px; }
  h1 { color: #b85c00; font-size: 1.42rem; line-height: 1.35; margin-bottom: 12px; }
  p { color: #686f68; font-size: 0.96rem; line-height: 1.7; margin-bottom: 24px; }
  a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 10px;
    background: #2d6a4f;
    color: #fff;
    font-weight: 700;
    text-decoration: none;
  }
  a:hover { background: #1e4d38; }
  @media (max-width: 420px) {
    .notice { padding: 34px 22px; }
    h1 { font-size: 1.28rem; }
  }
</style>
</head>
<body>
  <main class="notice">
    <div class="icon">🚧</div>
    <h1>기출문제 페이지 공사중</h1>
    <p>현재 기출문제 자료는 정비 중입니다.<br>강의내용 정리본은 기존처럼 이용할 수 있습니다.</p>
    <a href="forest.html">강의자료 목록으로 돌아가기</a>
  </main>
</body>
</html>
