<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>인간관계학 — 기출문제집</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f0f7f2;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.65}.back{position:sticky;top:0;z-index:10;padding:10px 14px;background:#fffffff2;border-bottom:1px solid #d7e2d8}.back a{display:inline-block;padding:7px 11px;border:1px solid #9bc7a7;border-radius:8px;background:#f4fbf6;color:#1f6b3a;text-decoration:none;font-weight:800}.wrap{max-width:900px;margin:auto;padding:20px}header{padding:26px 22px;border-radius:12px;background:linear-gradient(135deg,#285b45,#4b8b6a);color:#fff}header h1{margin:0 0 6px;font-size:1.5rem}.score{display:flex;gap:15px;align-items:center;flex-wrap:wrap;margin:18px 0;padding:14px 18px;border-radius:10px;background:#fff;box-shadow:0 1px 4px #0002}.score b{font-size:1.25rem;color:#28654d}.score button{margin-left:auto;border:0;border-radius:8px;padding:10px 17px;background:#28654d;color:#fff;font-weight:700;cursor:pointer}.part{margin:22px 0 12px;padding:10px 16px;border-radius:8px;background:#28654d;color:#fff;font-weight:800}.q{margin:0 0 14px;padding:18px 20px;border-radius:10px;background:#fff;box-shadow:0 1px 4px #00000012}.q h2{margin:0 0 11px;color:#1b4332;font-size:1rem}.num{color:#708078;font-size:.78rem}.opts{display:grid;gap:7px}.opts button{padding:9px 13px;border:1.5px solid #b7e4c7;border-radius:7px;background:#fff;text-align:left;font:inherit;cursor:pointer}.opts button:hover{background:#f0fdf4}.opts button.correct{background:#d1fae5;border-color:#059669;color:#065f46;font-weight:800}.opts button.wrong{background:#fee2e2;border-color:#dc2626;color:#991b1b}.opts.answered button{pointer-events:none}.explain{display:none;margin-top:10px;padding:10px 13px;border-left:4px solid #40916c;border-radius:6px;background:#f0fdf4;color:#1b4332;font-size:.9rem}.q.done .explain{display:block}@media(max-width:600px){.wrap{padding:12px}.q{padding:15px}.score button{margin-left:0}}</style><style>@media print{body{background:white}.back,.score{display:none}.wrap{max-width:none;padding:0}.q{box-shadow:none;border:1px solid rgb(216,227,220);break-inside:avoid}.explain{display:block}.opts button{cursor:default}.part{break-after:avoid}header{print-color-adjust:exact;-webkit-print-color-adjust:exact}}</style></head>
<body><div class="back"><a href="forest.html?k=yyj1201#subject-communication">← 공유페이지로 돌아가기</a></div><main class="wrap"><header><h1>인간관계학 — 기출문제집</h1><div>총 30문항 · 클릭형 정답 · 최신 강의 정리본 기반</div></header><section class="score"><span>풀이 <b id="done">0</b>/30</span><span>정답 <b id="right">0</b></span><span>점수 <b id="pct">0%</b></span><button type="button" onclick="location.reload()">처음부터</button></section><div id="quiz"></div></main>
<script>
const parts=[{title:'Part 1. 자기이해와 관찰 축',items:[
['인간관계 이해의 출발점은?',['타인 통제','자기이해','지식 암기','경쟁 강화'],1,'자신의 기질과 행동 특성을 먼저 알아야 타인과의 차이도 이해할 수 있습니다.'],
['Persona의 설명으로 맞는 것은?',['타고난 기질','사회·문화에 적응하며 쓰는 사회적 가면','반응속도 검사','직업 적성 점수'],1,'페르소나는 사회와 문화 속에서 표현되는 행동과 사회적 가면을 뜻합니다.'],
['자기평가서의 질문이 아닌 것은?',['나의 성격·행동 특성','타인이 자주 지적하는 속성','바꾸기 어려운 취약점','타인을 한 유형으로 확정할 수 있는가'],3,'자기평가는 자신을 관찰하기 위한 것이며 타인을 단정하는 도구가 아닙니다.'],
['외향(E)과 연결되는 반응속도는?',['빠름','느림','항상 동일','측정 불가'],0,'외향은 빠른 반응속도와 연결됩니다.'],
['내향(I)의 활동수준·신체언어 경향은?',['높고 큼','낮고 작음','항상 과장됨','항상 동일함'],1,'내향 경향은 낮은 활동수준과 작은 표정·제스처로 설명됩니다.'],
['목표중심과 연결되는 방향은?',['타인중심','자기중심','감정중심','소속중심'],1,'자기중심은 일·성취를 중시하는 목표중심과 연결됩니다.'],
['관계중심과 연결되는 방향은?',['타인중심','자기중심','목표중심','제압중심'],0,'타인중심은 사랑·소속을 중시하는 관계중심과 연결됩니다.'],
['사고 중심 판단의 기호는?',['E','I','T','F'],2,'T는 사고 중심 판단을 뜻합니다.']]},
{title:'Part 2. 네 가지 기질 유형',items:[
['ET에 해당하는 유형은?',['주도형','표출형','분석형','우호형'],0,'ET는 외향적 사고형인 주도형입니다.'],
['EF에 해당하는 유형은?',['분석형','우호형','주도형','표출형'],3,'EF는 외향적 감정형인 표출형입니다.'],
['IT에 해당하는 유형은?',['표출형','분석형','우호형','주도형'],1,'IT는 내향적 사고형인 분석형입니다.'],
['IF에 해당하는 유형은?',['우호형','분석형','표출형','주도형'],0,'IF는 내향적 감정형인 우호형입니다.'],
['담즙질로 제시된 유형은?',['우호형','표출형','분석형','주도형'],3,'강의자료에서 주도형은 외향적 사고형·담즙질입니다.'],
['다혈질로 제시된 유형은?',['표출형','분석형','우호형','주도형'],0,'강의자료에서 표출형은 외향적 감정형·다혈질입니다.'],
['점액질로 제시된 유형은?',['우호형','분석형','표출형','주도형'],1,'강의자료에서 분석형은 내향적 사고형·점액질입니다.'],
['우울질로 제시된 유형은?',['주도형','분석형','우호형','표출형'],2,'강의자료에서 우호형은 내향적 감정형·우울질입니다.'],
['속도가 빠르고 활동성이 높으며 목표·사고 중심인 유형은?',['주도형','우호형','분석형','표출형'],0,'이 조합은 ET 주도형의 핵심 경향입니다.']]},
{title:'Part 3. 표현 단서와 주요 속성',items:[
['명령·지시적이고 Yes/No가 분명한 말투는?',['주도형','표출형','우호형','분석형'],0,'주도형은 직선적이고 핵심 중심이며 Yes/No가 분명합니다.'],
['말이 많고 빠르며 감탄사와 큰 반응을 보이는 유형은?',['분석형','표출형','우호형','주도형'],1,'표출형은 즉흥적 표현과 풍부한 감정·비언어 반응이 특징입니다.'],
['우회적·동조적 말투와 고개 끄덕임이 관찰되는 유형은?',['우호형','주도형','분석형','표출형'],0,'우호형은 작은 몸짓으로 들어주고 동의하는 경향을 보입니다.'],
['논리적·사무적이며 감정 표현과 제스처가 적은 유형은?',['표출형','주도형','분석형','우호형'],2,'분석형은 논리와 근거를 따져 보고 표현은 적은 경향이 있습니다.'],
['유형 판단 시 함께 관찰해야 할 묶음은?',['말의 내용만','외모와 옷차림만','목소리·말투·표정·시선·몸짓·반응속도','직업과 나이만'],2,'한 단서로 단정하지 않고 여러 언어·비언어 단서를 함께 봅니다.'],
['인간의 주요 속성 네 가지에 포함되지 않는 것은?',['도전성','사교성','수용성','공격성'],3,'네 속성은 도전성·사교성·수용성·신중성입니다.'],
['도전성의 핵심 표현은?',['양보·순응·자제','판단·제압·승부','감성·친화·언어','경청·동조·침묵'],1,'도전성은 판단·제압·승부로 정리됩니다.'],
['사교성의 핵심 표현은?',['감성·친화·언어','판단·제압·승부','양보·순응·자제','논리·근거·비판'],0,'사교성은 감성·친화·언어로 정리됩니다.']]},
{title:'Part 4. 사티어 빙산과 자기성장',items:[
['사티어의 빙산 은유에서 물 위에 직접 드러나는 것은?',['열망','기대','행동','지각'],2,'빙산의 물 위에는 관찰 가능한 행동이 드러나고, 그 아래에 다양한 내면 층위가 있습니다.'],
['빙산 은유에서 행동 아래의 층위를 바르게 나열한 것은?',['대처방식·감정·지각·기대·열망·자기','직업·소득·지위·학력','말투·시선·옷차림·나이','판단·제압·승부·경쟁'],0,'정리본의 빙산 모형은 행동 아래의 대처방식·감정·감정에 대한 감정·지각·기대·열망·자기를 살펴봅니다.'],
['자기성장의 과정을 바르게 나열한 것은?',['자기탐색→자기이해→자기수용→자기변화→자기성장','자기변화→자기탐색→자기성장→자기수용','자기수용→타인통제→자기이해→경쟁','지식암기→타인평가→유형확정→자기성장'],0,'자기탐색에서 시작해 자기이해·자기수용·자기변화를 거쳐 자기성장으로 나아갑니다.'],
['성격을 통한 인간관계 이해에 대한 태도로 가장 적절한 것은?',['겉으로 드러난 행동만으로 상대를 확정한다','유형은 절대 바뀌지 않는다고 간주한다','표면 행동 아래의 감정·기대·열망까지 살펴본다','다른 유형을 틀린 유형으로 평가한다'],2,'사티어의 빙산 은유는 표면 행동만 보지 말고 그 아래의 내면을 함께 이해하도록 돕습니다.'],
['성격을 이해할 때 함께 살펴볼 세 가지 맥락은?',['개인적·사회적·신경생물학적 맥락','경제적·정치적·법률적 맥락','지리적·기후적·생태적 맥락','언어적·문학적·예술적 맥락'],0,'정리본은 인간을 개인적·사회적·신경생물학적 맥락에서 함께 이해하도록 제시합니다.']] }];
let count=0,right=0;const root=document.getElementById('quiz');parts.forEach(part=>{const h=document.createElement('div');h.className='part';h.textContent=part.title;root.append(h);part.items.forEach(item=>{count++;const q=document.createElement('article');q.className='q';q.innerHTML=`<div class="num">${count}번</div><h2>${item[0]}</h2><div class="opts">${item[1].map((o,i)=>`<button type="button" data-i="${i}">${i+1}. ${o}</button>`).join('')}</div><div class="explain"><strong>정답: ${item[2]+1}번</strong><br>${item[3]}</div>`;q.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(q.classList.contains('done'))return;q.classList.add('done');q.querySelector('.opts').classList.add('answered');const chosen=Number(b.dataset.i);q.querySelectorAll('button')[item[2]].classList.add('correct');if(chosen===item[2])right++;else b.classList.add('wrong');const done=document.querySelectorAll('.q.done').length;document.getElementById('done').textContent=done;document.getElementById('right').textContent=right;document.getElementById('pct').textContent=Math.round(right/done*100)+'%'});root.append(q)})});
</script></body></html>
