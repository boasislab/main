let answered = 0;
let correctCount = 0;
const TOTAL = questions.length;

function render() {
  const root = document.getElementById('questions');
  let html = '';
  let current = 0;
  questions.forEach((item, idx) => {
    if (item.s !== current) {
      current = item.s;
      html += '<div class="section-header">' + sections[current - 1].title + ' (' + sections[current - 1].count + '문항)</div>';
    }
    const no = idx + 1;
    html += '<div class="question-card">';
    html += '<div class="question-num">문제 ' + no + ' / ' + TOTAL + ' · 섹션 ' + item.s + (item.tip ? ' <span class="exam-tip-badge">★★ 시험</span>' : '') + '</div>';
    html += '<div class="question-text">' + item.q + '</div>';
    html += '<ul class="options">';
    item.o.forEach((choice, choiceIdx) => {
      html += '<li onclick="choose(this,' + (choiceIdx === item.a) + ',&quot;exp' + no + '&quot;)" ' + (choiceIdx === item.a ? 'data-correct' : '') + '>' + ['①','②','③','④'][choiceIdx] + ' ' + choice + '</li>';
    });
    html += '</ul>';
    html += '<div class="explanation" id="exp' + no + '">정답: <strong>' + ['①','②','③','④'][item.a] + '</strong><br>' + item.e + '</div>';
    html += '</div>';
  });
  root.innerHTML = html;
}

function choose(btn, isCorrect, expId) {
  const ul = btn.closest('ul');
  if (ul.dataset.done) return;
  ul.dataset.done = '1';
  answered++;
  if (isCorrect) {
    btn.classList.add('correct');
    correctCount++;
  } else {
    btn.classList.add('wrong');
    const correct = ul.querySelector('[data-correct]');
    if (correct) correct.classList.add('correct');
  }
  document.getElementById(expId).classList.add('show');
  document.getElementById('answered').textContent = answered;
  document.getElementById('correct-count').textContent = correctCount;
  const pct = Math.round(correctCount / answered * 100);
  document.getElementById('score').textContent = pct;
  document.getElementById('progress').style.width = (answered / TOTAL * 100) + '%';
  if (answered === TOTAL) {
    const fs = document.getElementById('finalScore');
    const msg = pct >= 80 ? '우수! 핵심 개념이 잘 잡혔습니다.' : pct >= 60 ? '양호합니다. 틀린 문제의 해설을 다시 보세요.' : '정리본을 한 번 더 훑고 재도전하세요.';
    fs.innerHTML = '완료! 최종 점수: ' + correctCount + ' / ' + TOTAL + ' (' + pct + '%)<br>' + msg;
    fs.classList.add('show');
    fs.scrollIntoView({ behavior: 'smooth' });
  }
}

render();
</script>
