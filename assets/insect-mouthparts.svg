<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">곤충 입의 형태와 먹이 습성</title><desc id="d">씹기, 관으로 빨기, 찌르고 빨기, 씹고 핥기, 스펀지처럼 핥기의 형태와 대표 곤충</desc>
<rect width="1000" height="470" rx="22" fill="#fffaf0"/><text x="500" y="40" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#493817">입의 형태는 먹는 방법을 보여 줍니다</text>
<g font-family="sans-serif" text-anchor="middle" fill="#2d382f">
<g transform="translate(25 75)"><rect width="180" height="325" rx="16" fill="#fff" stroke="#c79b45"/><path d="M45 95L90 55L135 95L90 140Z" fill="#e2aa49" stroke="#815e1c" stroke-width="4"/><path d="M62 105L90 130L118 105" fill="none" stroke="#573f18" stroke-width="6"/><text x="90" y="185" font-size="19" font-weight="700">씹는 입</text><text x="90" y="215" font-size="15">큰턱으로 자르고</text><text x="90" y="238" font-size="15">부수어 먹음</text><text x="90" y="285" font-size="15" font-weight="700">메뚜기·딱정벌레</text></g>
<g transform="translate(218 75)"><rect width="180" height="325" rx="16" fill="#fff" stroke="#6ca0c2"/><path d="M45 80Q140 120 67 165" fill="none" stroke="#4d91bd" stroke-width="13" stroke-linecap="round"/><text x="90" y="185" font-size="19" font-weight="700">관으로 빨기</text><text x="90" y="215" font-size="15">긴 주둥이를 펴서</text><text x="90" y="238" font-size="15">꽃꿀을 흡수</text><text x="90" y="285" font-size="15" font-weight="700">나비·나방</text></g>
<g transform="translate(411 75)"><rect width="180" height="325" rx="16" fill="#fff" stroke="#c56b6b"/><path d="M90 50V155M72 72L90 38L108 72" fill="none" stroke="#b54747" stroke-width="9"/><path d="M58 142H122" stroke="#7d3333" stroke-width="5"/><text x="90" y="185" font-size="19" font-weight="700">찌르고 빨기</text><text x="90" y="215" font-size="15">조직을 찌른 뒤</text><text x="90" y="238" font-size="15">수액·혈액 흡수</text><text x="90" y="285" font-size="15" font-weight="700">매미·노린재·모기</text></g>
<g transform="translate(604 75)"><rect width="180" height="325" rx="16" fill="#fff" stroke="#927abb"/><path d="M45 62L90 105L135 62M90 105V155" fill="none" stroke="#8062af" stroke-width="10" stroke-linecap="round"/><text x="90" y="185" font-size="19" font-weight="700">씹고 핥기</text><text x="90" y="215" font-size="15">턱과 혀를 함께 써</text><text x="90" y="238" font-size="15">꽃가루·꿀 섭취</text><text x="90" y="285" font-size="15" font-weight="700">꿀벌</text></g>
<g transform="translate(797 75)"><rect width="180" height="325" rx="16" fill="#fff" stroke="#68a27d"/><path d="M90 55V127Q90 150 55 150H125Q90 150 90 127" fill="none" stroke="#4e9168" stroke-width="11" stroke-linecap="round"/><text x="90" y="185" font-size="19" font-weight="700">스펀지형</text><text x="90" y="215" font-size="15">액체를 핥거나</text><text x="90" y="238" font-size="15">녹여서 흡수</text><text x="90" y="285" font-size="15" font-weight="700">집파리</text></g></g>
<text x="500" y="440" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#665b45">먹이의 상태와 얻는 방법에 맞추어 입 구조가 서로 다르게 진화했습니다.</text></svg>
