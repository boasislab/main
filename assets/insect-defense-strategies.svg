<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">곤충의 포식자 방어전략</title><desc id="d">위장, 죽은 체, 경고색, 모방, 화학 방어, 적극 방어의 원리와 예시</desc>
<rect width="1000" height="520" rx="22" fill="#fff5f4"/><text x="500" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#703c39">포식자로부터 살아남는 6가지 전략</text>
<g font-family="sans-serif" text-anchor="middle" fill="#27372e"><g transform="translate(40 75)"><rect width="280" height="170" rx="18" fill="#e9f1df" stroke="#7c9f63" stroke-width="3"/><path d="M45 65Q95 20 145 65Q95 112 45 65Z" fill="#79a961" stroke="#486b37" stroke-width="3"/><text x="200" y="62" font-size="20" font-weight="700">위장</text><text x="200" y="92" font-size="15">잎·가지·배경을 닮아</text><text x="200" y="116" font-size="15">발견을 피함</text></g>
<g transform="translate(360 75)"><rect width="280" height="170" rx="18" fill="#eeeeea" stroke="#99998b" stroke-width="3"/><path d="M42 94Q85 45 142 88M58 105L35 130M77 108L70 143M105 103L125 138" fill="none" stroke="#706f64" stroke-width="8" stroke-linecap="round"/><text x="205" y="62" font-size="20" font-weight="700">죽은 체</text><text x="205" y="92" font-size="15">움직임을 멈춰</text><text x="205" y="116" font-size="15">포식 반응을 줄임</text></g>
<g transform="translate(680 75)"><rect width="280" height="170" rx="18" fill="#fff0b9" stroke="#c19724" stroke-width="3"/><circle cx="88" cy="87" r="48" fill="#e04b45" stroke="#222" stroke-width="6"/><circle cx="70" cy="73" r="8"/><circle cx="105" cy="98" r="8"/><text x="205" y="62" font-size="20" font-weight="700">경고색</text><text x="205" y="92" font-size="15">눈에 띄는 색으로</text><text x="205" y="116" font-size="15">독·불쾌감을 알림</text></g>
<g transform="translate(40 275)"><rect width="280" height="170" rx="18" fill="#e8f3f8" stroke="#729fb5" stroke-width="3"/><path d="M35 85H145M55 55L75 85L55 115M125 55L105 85L125 115" fill="none" stroke="#e4af34" stroke-width="18"/><text x="205" y="62" font-size="20" font-weight="700">모방</text><text x="205" y="92" font-size="15">위험한 종의 색·모양을</text><text x="205" y="116" font-size="15">닮아 공격을 피함</text></g>
<g transform="translate(360 275)"><rect width="280" height="170" rx="18" fill="#f3e9f5" stroke="#a482aa" stroke-width="3"/><path d="M90 40Q150 85 90 135Q30 85 90 40Z" fill="#b47fba" stroke="#714f77" stroke-width="3"/><circle cx="70" cy="75" r="7" fill="#fff"/><text x="205" y="62" font-size="20" font-weight="700">화학 방어</text><text x="205" y="92" font-size="15">독·악취·자극 물질을</text><text x="205" y="116" font-size="15">분비하거나 축적</text></g>
<g transform="translate(680 275)"><rect width="280" height="170" rx="18" fill="#f9e5df" stroke="#bd8375" stroke-width="3"/><path d="M45 110L125 50M65 45L125 50L120 112" fill="none" stroke="#b35b47" stroke-width="9" stroke-linecap="round"/><text x="205" y="62" font-size="20" font-weight="700">적극 방어</text><text x="205" y="92" font-size="15">쏘기·물기·빠른 도피로</text><text x="205" y="116" font-size="15">직접 대응</text></g></g>
<text x="500" y="485" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#6b5552">핵심 구분: 숨기(위장) · 알리기(경고색) · 닮기(모방) · 직접 대응하기</text></svg>
