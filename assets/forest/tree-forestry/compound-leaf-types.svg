<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">복엽의 주요 종류 비교</title><desc id="d">3출엽, 장상복엽, 기수우상복엽, 우수우상복엽, 2회우상복엽, 3회우상복엽의 잎축과 소엽 배열 비교</desc>
  <rect width="1200" height="760" rx="28" fill="#f4f8f1"/><text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="700" fill="#173b2a">복엽은 ‘소엽 수’보다 잎축과 갈라지는 방식을 본다</text>
  <style>.c{fill:#fff;stroke:#c9d9ca;stroke-width:2}.s{stroke:#426b49;stroke-width:8;stroke-linecap:round}.l{fill:#76a95f;stroke:#315a39;stroke-width:2}.h{font:700 24px sans-serif;fill:#173b2a}.p{font:18px sans-serif;fill:#4b6252}.b{fill:#d58b36}.n{font:700 18px sans-serif;fill:#fff}</style>
  <g transform="translate(40 100)">
    <g><rect class="c" width="350" height="280" rx="20"/><text class="h" x="22" y="38">① 3출엽</text><text class="p" x="22" y="66">한 잎자루 끝에 소엽 3개</text><line class="s" x1="175" y1="242" x2="175" y2="135"/><ellipse class="l" cx="175" cy="112" rx="34" ry="54"/><ellipse class="l" cx="120" cy="152" rx="32" ry="52" transform="rotate(-50 120 152)"/><ellipse class="l" cx="230" cy="152" rx="32" ry="52" transform="rotate(50 230 152)"/><circle class="b" cx="175" cy="244" r="11"/><text class="n" x="168" y="251">눈</text></g>
    <g transform="translate(385)"><rect class="c" width="350" height="280" rx="20"/><text class="h" x="22" y="38">② 장상복엽</text><text class="p" x="22" y="66">손바닥처럼 한 점에서 방사</text><line class="s" x1="175" y1="242" x2="175" y2="160"/><g transform="translate(175 158)"><ellipse class="l" cy="-66" rx="27" ry="48"/><ellipse class="l" cx="-55" cy="-42" rx="27" ry="48" transform="rotate(-48 -55 -42)"/><ellipse class="l" cx="55" cy="-42" rx="27" ry="48" transform="rotate(48 55 -42)"/><ellipse class="l" cx="-82" cy="12" rx="25" ry="44" transform="rotate(-78 -82 12)"/><ellipse class="l" cx="82" cy="12" rx="25" ry="44" transform="rotate(78 82 12)"/></g><circle class="b" cx="175" cy="244" r="11"/><text class="n" x="168" y="251">눈</text></g>
    <g transform="translate(770)"><rect class="c" width="350" height="280" rx="20"/><text class="h" x="22" y="38">③ 기수우상복엽</text><text class="p" x="22" y="66">끝소엽 있음 → 홀수</text><line class="s" x1="175" y1="242" x2="175" y2="104"/><ellipse class="l" cx="175" cy="91" rx="27" ry="45"/><g><ellipse class="l" cx="120" cy="140" rx="25" ry="42" transform="rotate(-55 120 140)"/><ellipse class="l" cx="230" cy="140" rx="25" ry="42" transform="rotate(55 230 140)"/><ellipse class="l" cx="120" cy="200" rx="25" ry="42" transform="rotate(-65 120 200)"/><ellipse class="l" cx="230" cy="200" rx="25" ry="42" transform="rotate(65 230 200)"/></g><circle class="b" cx="175" cy="244" r="11"/><text class="n" x="168" y="251">눈</text></g>
  </g>
  <g transform="translate(40 420)">
    <g><rect class="c" width="350" height="280" rx="20"/><text class="h" x="22" y="38">④ 우수우상복엽</text><text class="p" x="22" y="66">끝소엽 없음 → 짝수</text><line class="s" x1="175" y1="242" x2="175" y2="100"/><g><ellipse class="l" cx="120" cy="122" rx="25" ry="42" transform="rotate(-55 120 122)"/><ellipse class="l" cx="230" cy="122" rx="25" ry="42" transform="rotate(55 230 122)"/><ellipse class="l" cx="120" cy="188" rx="25" ry="42" transform="rotate(-65 120 188)"/><ellipse class="l" cx="230" cy="188" rx="25" ry="42" transform="rotate(65 230 188)"/></g><circle class="b" cx="175" cy="244" r="11"/><text class="n" x="168" y="251">눈</text></g>
    <g transform="translate(385)"><rect class="c" width="350" height="280" rx="20"/><text class="h" x="22" y="38">⑤ 2회우상복엽</text><text class="p" x="22" y="66">주축에서 우상축이 다시 갈라짐</text><line class="s" x1="175" y1="242" x2="175" y2="105"/><g stroke="#426b49" stroke-width="5"><line x1="175" y1="135" x2="90" y2="95"/><line x1="175" y1="135" x2="260" y2="95"/><line x1="175" y1="195" x2="88" y2="158"/><line x1="175" y1="195" x2="262" y2="158"/></g><g fill="#76a95f"><ellipse cx="72" cy="84" rx="16" ry="29"/><ellipse cx="112" cy="102" rx="16" ry="29"/><ellipse cx="278" cy="84" rx="16" ry="29"/><ellipse cx="238" cy="102" rx="16" ry="29"/><ellipse cx="70" cy="151" rx="16" ry="29"/><ellipse cx="110" cy="168" rx="16" ry="29"/><ellipse cx="280" cy="151" rx="16" ry="29"/><ellipse cx="240" cy="168" rx="16" ry="29"/></g><circle class="b" cx="175" cy="244" r="11"/><text class="n" x="168" y="251">눈</text></g>
    <g transform="translate(770)"><rect class="c" width="350" height="280" rx="20"/><text class="h" x="22" y="38">⑥ 3회우상복엽</text><text class="p" x="22" y="66">깃 모양 분기가 세 단계</text><path d="M175 242V105M175 155L95 120M175 155L255 120M95 120L55 92M95 120L65 145M255 120L295 92M255 120L285 145" fill="none" stroke="#426b49" stroke-width="5"/><g fill="#76a95f"><ellipse cx="45" cy="84" rx="14" ry="25"/><ellipse cx="65" cy="151" rx="14" ry="25"/><ellipse cx="305" cy="84" rx="14" ry="25"/><ellipse cx="285" cy="151" rx="14" ry="25"/><ellipse cx="115" cy="112" rx="14" ry="25"/><ellipse cx="235" cy="112" rx="14" ry="25"/></g><circle class="b" cx="175" cy="244" r="11"/><text class="n" x="168" y="251">눈</text></g>
  </g>
</svg>
