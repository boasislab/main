<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">지구 생태용량 초과의 날 개념도</title>
  <desc id="desc">1971년부터 2025년까지 지구 생태용량 초과의 날이 앞당겨지는 흐름과 지구 1.8개가 필요하다는 개념을 보여주는 학습용 도표</desc>
  <rect width="920" height="560" fill="#f7fbff"/>
  <rect x="34" y="30" width="852" height="500" rx="18" fill="#ffffff" stroke="#bfd7ea" stroke-width="2"/>
  <text x="460" y="74" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="34" font-weight="800" fill="#123b57">지구 생태용량 초과의 날</text>
  <text x="460" y="110" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#406278">그 해 지구가 재생·흡수할 수 있는 자원을 모두 소진한 시점</text>

  <line x1="110" y1="322" x2="810" y2="322" stroke="#8fb5cc" stroke-width="7" stroke-linecap="round"/>
  <line x1="110" y1="322" x2="242" y2="322" stroke="#2d8b57" stroke-width="7" stroke-linecap="round"/>
  <line x1="242" y1="322" x2="810" y2="322" stroke="#d74b45" stroke-width="7" stroke-linecap="round"/>

  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" text-anchor="middle">
    <circle cx="110" cy="322" r="14" fill="#2d8b57"/>
    <text x="110" y="360" font-size="17" font-weight="700" fill="#17472b">1월 1일</text>
    <text x="110" y="386" font-size="15" fill="#426b50">연간 생태예산 시작</text>

    <circle cx="242" cy="322" r="18" fill="#d74b45"/>
    <text x="242" y="262" font-size="22" font-weight="800" fill="#b52d2b">대한민국 4월 9일</text>
    <text x="242" y="291" font-size="16" fill="#704139">세계 평균보다 훨씬 빠른 초과</text>
    <path d="M242 302 L242 195" stroke="#d74b45" stroke-width="3" stroke-dasharray="8 8"/>

    <circle cx="525" cy="322" r="18" fill="#e4862c"/>
    <text x="525" y="262" font-size="22" font-weight="800" fill="#a65b16">세계 7월 말 무렵</text>
    <text x="525" y="291" font-size="16" fill="#704139">2019년 기준 7월 29일</text>
    <path d="M525 302 L525 195" stroke="#e4862c" stroke-width="3" stroke-dasharray="8 8"/>

    <circle cx="810" cy="322" r="14" fill="#6b8293"/>
    <text x="810" y="360" font-size="17" font-weight="700" fill="#344957">12월 31일</text>
    <text x="810" y="386" font-size="15" fill="#516879">정상 범위의 끝</text>
  </g>

  <g transform="translate(105 142)">
    <circle cx="58" cy="58" r="52" fill="#dff2e4" stroke="#2d8b57" stroke-width="4"/>
    <path d="M31 64 C42 35 70 25 91 45 C95 76 68 93 42 81 C36 77 32 71 31 64Z" fill="#3fa66b"/>
    <path d="M44 75 C58 63 72 51 89 44" stroke="#1f7044" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="145" y="48" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="800" fill="#184f31">지구 1개로 감당 가능했던 시기</text>
    <text x="145" y="78" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#426b50">1970년대 초반에는 연간 재생량 안에서 소비</text>
  </g>

  <g transform="translate(565 142)">
    <circle cx="54" cy="58" r="48" fill="#dff2e4" stroke="#d74b45" stroke-width="4"/>
    <circle cx="96" cy="58" r="48" fill="#ffe2df" stroke="#d74b45" stroke-width="4" opacity=".88"/>
    <text x="75" y="65" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="26" font-weight="900" fill="#b52d2b">1.8</text>
    <text x="75" y="94" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" font-weight="700" fill="#b52d2b">Earths</text>
    <text x="75" y="128" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#b52d2b">2025년 기준 지구 1.8개 필요</text>
  </g>

  <rect x="108" y="424" width="704" height="64" rx="12" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="460" y="451" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#856404">초과일 이후 소비 = 미래 세대가 쓸 자원을 앞당겨 쓰는 생태적 적자</text>
  <text x="460" y="478" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#856404">강의 표현: 우리는 생태 자원의 “빚쟁이”가 되는 상태</text>
</svg>
