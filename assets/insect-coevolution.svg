<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 430" role="img" aria-labelledby="t d"><title id="t">식물과 곤충의 공진화</title><desc id="d">꽃의 형질과 곤충의 입, 감각, 행동이 서로 선택압을 주며 변화하고 수분 성공으로 이어지는 관계</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#50695b"/></marker></defs>
<rect width="950" height="430" rx="22" fill="#f5f2fb"/><text x="475" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#4e3e70">식물과 곤충의 공진화 관계</text>
<g font-family="sans-serif" fill="#26392f"><rect x="55" y="85" width="280" height="245" rx="20" fill="#eef7eb" stroke="#75a76c" stroke-width="3"/><circle cx="195" cy="155" r="42" fill="#f2c45b" stroke="#8a6a1e" stroke-width="4"/><g fill="#db7788" stroke="#984858" stroke-width="3"><ellipse cx="195" cy="98" rx="25" ry="45"/><ellipse cx="195" cy="212" rx="25" ry="45"/><ellipse cx="138" cy="155" rx="45" ry="25"/><ellipse cx="252" cy="155" rx="45" ry="25"/></g><text x="195" y="280" text-anchor="middle" font-size="20" font-weight="700">식물의 변화</text><text x="195" y="308" text-anchor="middle" font-size="15">꽃의 색·향·모양·꽃통 길이</text>
<rect x="615" y="85" width="280" height="245" rx="20" fill="#edf5fb" stroke="#729fc0" stroke-width="3"/><path d="M755 170Q680 95 650 145Q702 178 755 170Q830 95 860 145Q808 178 755 170M755 170V230" fill="#78acd0" stroke="#356b8d" stroke-width="5"/><text x="755" y="280" text-anchor="middle" font-size="20" font-weight="700">곤충의 변화</text><text x="755" y="308" text-anchor="middle" font-size="15">입 길이·색 감각·방문 행동</text>
<path d="M335 145C430 80 520 80 615 145" fill="none" stroke="#50695b" stroke-width="4" marker-end="url(#a)"/><path d="M615 245C520 315 430 315 335 245" fill="none" stroke="#50695b" stroke-width="4" marker-end="url(#a)"/><text x="475" y="105" text-anchor="middle" font-size="16">잘 맞는 곤충을 더 유인</text><text x="475" y="300" text-anchor="middle" font-size="16">잘 맞는 꽃에서 먹이 획득</text>
<rect x="310" y="348" width="330" height="52" rx="14" fill="#fff1b8" stroke="#c19a26" stroke-width="2"/><text x="475" y="381" text-anchor="middle" font-size="18" font-weight="700">결과: 수분 성공과 번식 기회 증가</text></g></svg>
