<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>숲해설 학습내용 복습목록</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:#203028;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.65}.wrap{max-width:900px;margin:auto;padding:18px}header{background:#23613e;color:#fff;padding:24px;border-radius:14px}.back{color:#fff;font-weight:800;text-decoration:none}.summary,.form,.item{background:#fff;border:1px solid #d9e4dc;border-radius:11px;padding:15px;margin:14px 0}.form{display:grid;grid-template-columns:1fr 1.5fr auto;gap:8px}.form input{min-width:0;border:1px solid #bdcbbf;border-radius:8px;padding:10px;font-size:15px}.form button,.actions button{border:0;border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer}.form button{background:#23613e;color:#fff}.item{border-left:5px solid #d97706}.item.done{border-left-color:#2f855a;opacity:.72}.subject{font-size:13px;color:#647067;font-weight:800}.topic{font-size:18px;font-weight:900;margin:4px 0 10px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.actions button{background:#e4f1e8;color:#14532d}.actions .del{background:#fee2e2;color:#991b1b}.actions a{color:#176b3a;font-weight:800}.empty{text-align:center;color:#68736d;padding:35px}.fine{font-size:12px;color:#68736d}@media(max-width:650px){.form{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body><main class="wrap"><header><a class="back" href="forest.html">← 숲해설 공유페이지</a><h1>📗 학습내용 복습목록</h1><p>강의 정리 중 다시 볼 주제를 과목별로 모아 관리합니다.</p></header><div class="summary" id="summary"></div><form class="form" id="form"><input id="subject" placeholder="과목명" required><input id="topic" placeholder="복습할 내용" required><button>복습목록 추가</button></form><div id="list"></div><p class="fine">목록은 현재 브라우저에 저장됩니다. 브라우저 데이터를 삭제하거나 다른 기기를 사용하면 목록이 이어지지 않습니다.</p></main><script>
(function(){var KEY='forest_learning_review_v1';function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function save(v){localStorage.setItem(KEY,JSON.stringify(v));render()}function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}var notes=load(),seeds=[{id:'tree-forestry-leaf-parts',subject:'나무·숲·임업',topic:'잎의 부위 명칭과 단엽·복엽',source:'0310_나무숲임업_정리본_최종.html#s4'},{id:'tree-forestry-oak-fruit',subject:'나무·숲·임업',topic:'참나무 및 열매의 특징',source:'0310_나무숲임업_정리본_최종.html#s9c'}];seeds.slice().reverse().forEach(function(seed){if(!notes.some(function(n){return n.id===seed.id})){notes.unshift({id:seed.id,subject:seed.subject,topic:seed.topic,source:seed.source,done:false,createdAt:new Date().toISOString()})}});localStorage.setItem(KEY,JSON.stringify(notes));function render(){var a=load(),open=a.filter(function(n){return!n.done}).length;document.getElementById('summary').innerHTML='<strong>전체 '+a.length+'개</strong> · 복습 필요 <strong style="color:#b45309">'+open+'</strong> · 복습완료 '+(a.length-open);document.getElementById('list').innerHTML=a.length?a.map(function(n){return '<article class="item '+(n.done?'done':'')+'" data-id="'+esc(n.id)+'"><div class="subject">'+esc(n.subject)+'</div><div class="topic">'+esc(n.topic)+'</div><div class="actions"><button class="toggle">'+(n.done?'다시 복습':'복습완료')+'</button><button class="del">삭제</button>'+(n.source?'<a href="'+encodeURI(esc(n.source))+'">학습내용 보기 →</a>':'')+'</div></article>'}).join(''):'<div class="empty">등록된 복습 내용이 없습니다.</div>'}document.getElementById('form').onsubmit=function(e){e.preventDefault();var a=load();a.unshift({id:'review-'+Date.now(),subject:document.getElementById('subject').value.trim(),topic:document.getElementById('topic').value.trim(),source:'',done:false,createdAt:new Date().toISOString()});save(a);e.target.reset()};document.getElementById('list').onclick=function(e){var c=e.target.closest('.item');if(!c)return;var a=load(),n=a.find(function(x){return x.id===c.dataset.id});if(e.target.classList.contains('toggle')&&n)n.done=!n.done;if(e.target.classList.contains('del'))a=a.filter(function(x){return x.id!==c.dataset.id});save(a)};render()})();
</script></body></html>
