let answered = new Array(QS.length).fill(false);
let correct = new Array(QS.length).fill(false);
function render() {
  const wrap = document.getElementById('quiz');
  wrap.innerHTML = QS.map((item, idx) => `
    <div class="q-card" id="qcard-${idx}">
      <div class="q-num">문항 ${idx + 1}</div>
      <div class="q-text">${item.q}</div>
      <div class="options">
        ${item.opts.map((opt, oi) => `<button class="opt-btn" onclick="choose(${idx}, ${oi})">${['①','②','③','④'][oi]} ${opt}</button>`).join('')}
      </div>
      <div class="explanation" id="exp-${idx}">${item.exp}</div>
    </div>`).join('');
}
function choose(qi, oi) {
  if (answered[qi]) return;
  answered[qi] = true;
  correct[qi] = oi === QS[qi].ans;
  const card = document.getElementById(`qcard-${qi}`);
  card.classList.add(correct[qi] ? 'correct-card' : 'wrong-card');
  const btns = card.querySelectorAll('.opt-btn');
  btns.forEach((btn, bi) => {
    btn.disabled = true;
    if (bi === QS[qi].ans) btn.classList.add('show-answer');
    if (bi === oi && bi === QS[qi].ans) btn.classList.add('selected-correct');
    if (bi === oi && bi !== QS[qi].ans) btn.classList.add('selected-wrong');
  });
  document.getElementById(`exp-${qi}`).classList.add('visible');
  updateScore();
}
function updateScore() {
  document.getElementById('score').textContent = `${correct.filter(Boolean).length} / ${QS.length}`;
}
function resetAll() { answered.fill(false); correct.fill(false); render(); updateScore(); window.scrollTo({top:0, behavior:'smooth'}); }
render();
