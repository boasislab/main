add('1차','Ⅲ교과','응급처치',[["쯔쯔가무시병과 SFTS를 구별하라.","쯔쯔가무시병은 털진드기 유충·가피가 특징이고, SFTS는 작은소참진드기 매개 바이러스 감염이다."],["말벌 안전수칙으로 바르지 않은 것은?","어두운색 옷을 입는 것."],["응급처치 기본 단계는?","Check → Call → Care."],["출혈 응급처치 원칙은?","직접압박·감염 예방·드레싱 유지. 지혈대 사용 조건은 최신 응급처치 지침과 대조 필요.","추가 검증"]]);

add('2차','Ⅲ교과','프로그램개발',[["산림교육의 법적 정의는?","산림의 다양한 기능을 체계적으로 체험·탐방·학습해 중요성을 이해하고 지식을 습득하며 올바른 가치관을 갖게 하는 교육."],["기획과 계획의 차이는?","기획은 목표 실현을 설계하는 과정, 계획은 그 과정에서 나온 구체적 산출물."],["참가자 분석 항목은?","나이·지적 수준·인원·참가 경험·장애 포함 여부·참가 목적·학력·거주지·관련 프로그램 경험 등."],["평가보고서는 선택사항인가?","아니다. 평가는 프로그램의 필수 과정이다."],["환경교육 패러다임의 흐름은?","계몽 → 지식 → 체험 → 참여의 시대로 확장."],["다감각 해설을 하는 이유는?","참가자가 여러 감각을 능동적으로 활용하며, 특히 유아기에는 감각적 자연관찰이 학습에 효과적이기 때문이다."]]);

add('1차','Ⅲ교과','숲해설개론',[["숲해설 기법으로 옳지 않은 것은?","멸종위기종의 위치·상세 정보를 노출하거나 직접 이용하는 해설은 피한다. 기본 복장·사전답사·지적 정직성·안전교육은 중요하다."],["자연매체 활용 해설의 올바른 원칙은?","계절·대상·장소에 맞는 매체를 고르고 감동과 느낌이 있는 모둠 활동을 하되, 보호종·멸종위기종을 직접 훼손하거나 이용하지 않는다."]]);

function render(){const s=document.querySelector('#search').value.trim().toLowerCase(),r=document.querySelector('#round').value,c=document.querySelector('#course').value;const rows=D.filter(x=>(!r||x.round===r)&&(!c||x.course===c)&&(!s||`${x.subject} ${x.q} ${x.a}`.toLowerCase().includes(s)));document.querySelector('#stats').textContent=`${rows.length}문항`;document.querySelector('#list').innerHTML=rows.map((x,i)=>`<article class="card"><div class="meta"><span class="tag">${x.round}</span><span class="tag">${x.course}</span><span class="tag">${x.subject}</span><span class="tag ${x.status==='추가 검증'?'review':'ok'}">${x.status}</span></div><div class="q">${i+1}. ${x.q}</div><div class="a"><strong>복원 답·해설:</strong> ${x.a}</div><div class="src">${links[x.subject]?`📚 <a href="${links[x.subject]}" target="_blank">${x.subject} 강의 정리에서 확인</a>`:'📌 연결 강의 정리: 과목 통합 검토'}</div></article>`).join('')||'<p>검색 결과가 없습니다.</p>'}document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',render));render();
