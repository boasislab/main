<script>

var perfectCelebrationShown = false;
function launchPerfectCelebration(){
  if(perfectCelebrationShown)return;
  perfectCelebrationShown = true;
  try { var fanfare = new Audio('assets/forest/forest_quiz_fanfare.mp3'); fanfare.volume = 0.75; fanfare.play().catch(function(){}); } catch (e) {}
  var colors=['#ff1744','#ffea00','#00e676','#00b0ff','#7c4dff','#ff6d00','#ff4081','#18ffff','#ffffff'];
  var overlay=document.createElement('div');
  overlay.className='perfect-celebration';
  overlay.innerHTML='<div class="perfect-celebration-card"><div class="perfect-celebration-title">축하합니다</div></div>';
  document.body.appendChild(overlay);
  for(var i=0;i<220;i++){var piece=document.createElement('span');piece.className='confetti-piece';piece.style.left=Math.random()*100+'vw';piece.style.background=colors[i%colors.length];piece.style.animationDelay=Math.random()*1.2+'s';piece.style.setProperty('--drift',Math.random()*360-180+'px');overlay.appendChild(piece)}
  function burst(cx,cy){for(var j=0;j<48;j++){var spark=document.createElement('span');var angle=Math.PI*2*j/48;var distance=110+Math.random()*170;spark.className='firework-spark';spark.style.left=cx+'px';spark.style.top=cy+'px';spark.style.background=colors[j%colors.length];spark.style.color=spark.style.background;spark.style.setProperty('--x',Math.cos(angle)*distance+'px');spark.style.setProperty('--y',Math.sin(angle)*distance+'px');overlay.appendChild(spark)}}
  var points=[[.18,.28],[.36,.18],[.58,.25],[.78,.30],[.26,.55],[.50,.48],[.74,.58]];points.forEach(function(pt,idx){setTimeout(function(){burst(window.innerWidth*pt[0],window.innerHeight*pt[1])},idx*160)});setTimeout(function(){burst(window.innerWidth*.5,window.innerHeight*.36)},1300);
  setTimeout(function(){overlay.remove()},5600);
}

const QS = [
  {
    q: "생태(Ecology)의 어원으로 올바른 것은?",
    opts: ["라틴어 '에코(eco)' + '로고스(logos)'", "그리스어 '오이코스(집)' + '로고스(배우다)'", "그리스어 '오이코스(집)' + '노모스(다루다)'", "라틴어 '에코(eco)' + '노미아(경제)'"],
    ans: 1,
    exp: "생태(Ecology)는 그리스어 오이코스(집)와 로고스(배우다)의 합성어. 경제(Economics)는 오이코스(집)+노모스(다루다)."
  },
  {
    q: "생태맹에 대한 설명으로 옳은 것은?",
    opts: ["글을 모르는 사람을 의미한다", "자신이 모른다는 사실을 알고 있다", "자신이 모른다는 것을 모르고, 몰라도 부끄럽지 않다고 여기는 상태", "의지로 극복할 수 없는 선천적 장애"],
    ans: 2,
    exp: "생태맹은 자신이 생태에 무지하다는 것을 인식하지 못하고, 몰라도 괜찮다고 여기는 상태. 기후위기 시대에 매우 위험함."
  },
  {
    q: "생태중심주의의 특징으로 옳은 것은?",
    opts: ["인간이 자연 위에서 지배하는 상하 구조", "자연을 인간의 수단과 자원으로 봄", "인간과 다른 생물이 동등한 내재적 가치를 가지는 원(圓) 구조", "경제 발전을 위해 자연 이용을 극대화해야 함"],
    ans: 2,
    exp: "생태중심주의(에코중심)는 원(圓) 구조로 인간과 자연이 동등한 가치를 지님. 인간중심주의(에고중심)는 상하 지배 구조."
  },
  {
    q: "환경 위기 시계에서 12시가 의미하는 것은?",
    opts: ["환경이 가장 좋은 상태", "조금 불안한 상태", "환경 위기가 완전히 끝나는 종료 시점", "회복 가능한 최후의 시점"],
    ans: 2,
    exp: "12시는 되돌아가는 것이 아닌 종료(끝)를 의미함. 1992년 리우 환경회의부터 매년 측정. 2025년 기준 전 세계 9시 33분."
  },
  {
    q: "2025년 기준 대한민국 환경 위기 시계는?",
    opts: ["7시 49분", "8시 53분", "9시 19분", "9시 47분"],
    ans: 1,
    exp: "2025년 기준 전 세계 9시 33분, 대한민국 8시 53분. 1992년 7시 49분에서 지속 상승 중."
  },
  {
    q: "MCC 탄소 시계가 나타내는 것은?",
    opts: ["지구 온도 상승 현황을 24시간으로 표현한 시계", "지구 온도 1.5도 상승 한계를 유지하기 위해 남은 탄소 배출 가능량", "이산화탄소 농도를 연도별로 보여주는 그래프", "탄소국경세 부과 기준을 시각화한 자료"],
    ans: 1,
    exp: "MCC 탄소 시계는 지구 온도 상승 한계 1.5도를 지키기 위해 배출 가능한 탄소 잔여량을 실시간으로 보여줌. 현재 약 3년 3개월."
  },
  {
    q: "지구 생태 용량 초과의 날에 대한 설명으로 틀린 것은?",
    opts: ["2025년 기준 지구 1.8개가 필요한 상태이다", "2019년 세계 기준 초과일은 7월 29일이다", "대한민국 초과일은 4월 9일로 세계 최상위권이다", "카타르보다 온두라스가 더 빠른 날짜에 초과한다"],
    ans: 3,
    exp: "카타르(2월 4일)가 가장 빠르고, 온두라스(11월 말)가 가장 느림. 한국인처럼 쓰면 지구 약 3개가 필요."
  },
  {
    q: "기후(Climate)의 정의로 올바른 것은?",
    opts: ["오늘의 날씨처럼 시시각각 변화하는 대기 현상", "특정 지역의 10년 이상 평균 기상 상태", "특정 지역의 30년 이상 평균 기상 상태", "전 지구의 1년 평균 온도"],
    ans: 2,
    exp: "기후(Climate)는 특정 지역의 30년 이상 평균 기상 상태. 기상(Weather)은 시시각각 변화하는 대기 현상."
  },
  {
    q: "'기후위기'라는 용어 사용을 처음 권고한 언론사와 연도는?",
    opts: ["CNN, 2015년", "BBC, 2018년", "영국 가디언지, 2019년", "뉴욕타임스, 2020년"],
    ans: 2,
    exp: "2019년 영국 가디언지에서 '기후변화(Climate Change)' 대신 '기후위기(Climate Crisis)'를 권고. 더 정확한 표현으로 인정받음."
  },
  {
    q: "지구온난화보다 더 정확한 표현으로 권고되는 용어는?",
    opts: ["지구 열화", "지구 가열(Global Heating) / 지구 열타화", "지구 온난위기", "지구 온도재난"],
    ans: 1,
    exp: "'온난화(Warming·따뜻함)'는 긍정적 뉘앙스가 있어 부정확. '지구 가열(Global Heating)' 또는 '지구 열타화'가 실제 상황을 더 정확히 표현."
  },
  {
    q: "온실가스 6종에 해당하지 않는 것은?",
    opts: ["이산화탄소(CO₂)", "메탄(CH₄)", "아산화질소(N₂O)", "이산화황(SO₂)"],
    ans: 3,
    exp: "온실가스 6종: 이산화탄소, 메탄, 아산화질소, 수소불화탄소(HFCs), 과불화탄소(PFCs), 육불화황(SF₆). 이산화황은 포함되지 않음."
  },
  {
    q: "온실가스 중 지구 온난화 기여도가 가장 높은 것은?",
    opts: ["메탄(CH₄) — 지구온난화 지수가 높기 때문", "아산화질소(N₂O) — 310의 지구온난화 지수 때문", "이산화탄소(CO₂) — 배출량이 압도적으로 많기 때문", "수소불화탄소(HFCs) — 냉매 사용이 급증했기 때문"],
    ans: 2,
    exp: "이산화탄소는 지구온난화 지수(GWP=1)로 가장 낮지만, 배출량이 압도적으로 많아 온난화 기여도 56%로 1위."
  },
  {
    q: "킬링 곡선(Keeling Curve)에 대한 설명으로 옳은 것은?",
    opts: ["1850년 산업혁명부터 CO₂ 농도를 측정한 그래프", "봄·여름에 CO₂가 감소하고 가을·겨울에 증가하는 톱니 모양이 나타남", "CO₂ 농도와 지구온도는 반비례 관계이다", "산업화 이전 CO₂ 농도는 350ppm이었다"],
    ans: 1,
    exp: "1958년부터 측정 시작. 봄·여름 광합성 활발→CO₂ 감소, 가을·겨울→CO₂ 증가로 톱니 모양. 전체적으로 상승(278ppm→420ppm). 온도와 비례."
  },
  {
    q: "산업화 이전 CO₂ 농도와 2021년 기준 CO₂ 농도는?",
    opts: ["200ppm → 350ppm", "278ppm → 약 419~420ppm", "300ppm → 380ppm", "250ppm → 450ppm"],
    ans: 1,
    exp: "산업화 이전 278ppm에서 2021년 기준 약 419~420ppm으로 증가. 킬링 곡선으로 확인됨."
  },
  {
    q: "지구 온도 1.5도 vs 2도 상승 시 곤충 멸종 위기 비율은?",
    opts: ["1.5도: 3%, 2도: 6%", "1.5도: 6%, 2도: 18%", "1.5도: 10%, 2도: 20%", "1.5도: 8%, 2도: 16%"],
    ans: 1,
    exp: "곤충: 1.5도→6%, 2도→18% / 식물: 1.5도→8%, 2도→16% / 척추동물: 1.5도→4%, 2도→8%. 척추동물에는 인간도 포함."
  },
  {
    q: "SSP 시나리오에서 아무것도 하지 않을 경우 예상되는 온도 상승은?",
    opts: ["2도 이상", "3.6도", "4.9도 이상", "6도 이상"],
    ans: 2,
    exp: "아무것도 안 하면 4.9도 이상, 현재 정책 수준 유지 시 3.6도, 적극적 감축 시 1.8도 이하로 억제 가능."

function render() {
  const container = document.getElementById('quiz');
  container.innerHTML = '';
  QS.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'card-' + i;

    const num = document.createElement('div');
    num.className = 'q-num';
    num.textContent = `문제 ${i + 1}`;
    card.appendChild(num);

    const qt = document.createElement('div');
    qt.className = 'q-text';
    qt.textContent = q.q;
    card.appendChild(qt);

    const opts = document.createElement('div');
    opts.className = 'options';
    q.opts.forEach((opt, j) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = `${['①','②','③','④'][j]} ${opt}`;
      btn.onclick = () => answer(i, j, btn, opts);
      opts.appendChild(btn);
    });
    card.appendChild(opts);

    const exp = document.createElement('div');
    exp.className = 'explanation';
    exp.id = 'exp-' + i;
    exp.textContent = '📌 ' + q.exp;
    card.appendChild(exp);

    container.appendChild(card);
  });
  renderShortAnswers();
  updateScore();
}

  const container = document.getElementById('short-answer-quiz');
  container.innerHTML = '';

    card.className = 'q-card short-answer-card';
    card.id = 'short-card-' + i;

    const num = document.createElement('div');
    num.className = 'q-num';
    num.textContent = `단답형 ${i + 1}`;
    card.appendChild(num);

    const qt = document.createElement('div');
    qt.className = 'q-text';
    qt.textContent = q.q;
    card.appendChild(qt);

    const row = document.createElement('div');
    row.className = 'answer-row';

    const input = document.createElement('input');
    input.className = 'answer-input';
    input.type = 'text';
    input.autocomplete = 'off';
    input.placeholder = '정답 입력';
    input.id = 'short-input-' + i;
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkShortAnswer(i);
    });
    row.appendChild(input);

    const btn = document.createElement('button');
    btn.className = 'check-btn';
    btn.type = 'button';
    btn.textContent = '채점';
    btn.id = 'short-btn-' + i;
    btn.onclick = () => checkShortAnswer(i);
    row.appendChild(btn);

    card.appendChild(row);

    const result = document.createElement('div');
    result.className = 'short-result';
    result.id = 'short-result-' + i;
    card.appendChild(result);

    container.appendChild(card);
  });
}

  if (answered[qi]) return;
  answered[qi] = true;

  const correct = QS[qi].ans;
  const allBtns = opts.querySelectorAll('.opt-btn');
  allBtns.forEach(b => b.disabled = true);

  const card = document.getElementById('card-' + qi);
  const exp = document.getElementById('exp-' + qi);

  if (selected === correct) {
    btn.classList.add('selected-correct');
    card.classList.add('correct-card');
    correctCount++;
  } else {
    btn.classList.add('selected-wrong');
    allBtns[correct].classList.add('show-answer');
    card.classList.add('wrong-card');
  }
  exp.classList.add('visible');
  updateScore();
}

function updateScore() {
  const done = answered.filter(Boolean).length;
  document.getElementById('score').textContent = `${correctCount} / ${QS.length}`;
  document.getElementById('short-score').textContent = `${shortCorrectCount} / ${SA.length}`;
  if (done === QS.length && correctCount === QS.length) launchPerfectCelebration();
}

function normalizeAnswer(value) {
  return String(value || '')
    .toLowerCase()
    .replace(/[·ㆍ\-\s()（）\[\]{}.,!?'"“”‘’]/g, '')
    .replace(/℃/g, '도');
}

function checkShortAnswer(i) {
  if (shortAnswered[i]) return;

  const q = SA[i];
  const input = document.getElementById('short-input-' + i);
  const btn = document.getElementById('short-btn-' + i);
  const result = document.getElementById('short-result-' + i);
  const card = document.getElementById('short-card-' + i);
  const value = input.value.trim();

  if (!value) {
    input.focus();
    input.placeholder = '답을 먼저 입력하세요';
    return;
  }

  const normalized = normalizeAnswer(value);
  const answers = [q.ans].concat(q.aliases || []).map(normalizeAnswer);
  const isCorrect = answers.some(ans => normalized === ans || normalized.includes(ans) || ans.includes(normalized));
  const matchedKeys = (q.keys || []).filter(key => normalized.includes(normalizeAnswer(key)));
  const isPartial = !isCorrect && matchedKeys.length > 0;

  shortAnswered[i] = true;
  input.disabled = true;
  btn.disabled = true;
  result.classList.add('visible');

  if (isCorrect) {
    shortCorrectCount++;
    input.classList.add('correct');
    result.classList.add('correct');
    card.classList.add('correct-card');
    result.innerHTML = `정답입니다.<br><span class="answer-chip">정답: ${q.ans}</span><br>${q.exp}`;
  } else if (isPartial) {
    input.classList.add('partial');
    result.classList.add('partial');
    result.innerHTML = `부분정답입니다. 핵심어는 잡았지만 정확한 개념명으로 다시 외우세요.<br><span class="answer-chip">정답: ${q.ans}</span><br>${q.exp}`;
  } else {
    input.classList.add('wrong');
    result.classList.add('wrong');
    card.classList.add('wrong-card');
    result.innerHTML = `오답입니다.<br><span class="answer-chip">정답: ${q.ans}</span><br>${q.exp}`;
  }
  updateScore();
}

function resetAll() {
  perfectCelebrationShown=false;
  correctCount = 0;
  answered.fill(false);
  shortCorrectCount = 0;
  shortAnswered.fill(false);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
</script>
